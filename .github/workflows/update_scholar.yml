name: Update Google Scholar Metrics

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write   # needed to push the updated data/scholar_data.json

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the repository ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ──
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install scholarly

      # ── 4. Run the fetch script ──
      #    Pass SCRAPER_API_KEY if you have one configured as a repository secret.
      #    If the secret is absent the script falls back to direct connection.
      - name: Fetch Scholar data
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/fetch_scholar.py

      # ── 5. Commit the updated JSON only if it changed ──
      - name: Commit updated scholar data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar_data.json
          # Only commit when there are actual changes
          git diff --cached --quiet || git commit -m "chore: update Scholar metrics $(date -u '+%Y-%m-%d')"
          git push
