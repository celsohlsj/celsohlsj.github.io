name: Update Scholar Data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install google-search-results

      - name: Fetch Google Scholar data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python fetch_scholar.py

      - name: Push data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar_data.json data/scholar_papers.json
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git stash
          git pull --rebase origin main
          git stash pop
          git add data/scholar_data.json data/scholar_papers.json
          git commit -m "chore: update Scholar data $(date -u +'%Y-%m-%d')"
          git push origin main
