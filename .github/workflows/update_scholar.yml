name: Update Scholar Data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# ── permissão de escrita no repositório ──────────────────────────── #
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-search-results

      - name: Fetch Google Scholar data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python fetch_scholar.py

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar_data.json data/scholar_papers.json
          git diff --cached --quiet \
            || git commit -m "chore: update Scholar data $(date -u +'%Y-%m-%d')"
          git push
